<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b0b12" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)">
  <title>Home · VettID Member Service</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/assets/fonts.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/member.css">
  <script type="module" src="/js/theme.js"></script>
  <script type="module" src="/js/home.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="/" aria-label="VettID Member Service home">
      <img class="brand-logo brand-logo-dark" src="/assets/vettid-horizontal-transparent.svg" alt="" width="752" height="300">
      <img class="brand-logo brand-logo-light" src="/assets/vettid-horizontal-transparent-on-light.svg" alt="" width="752" height="300">
      <img class="brand-icon" src="/assets/favicon.svg" alt="" width="512" height="512">
      <span class="brand-tag">Members</span>
    </a>
    <div class="header-tools">
      <button type="button" class="theme-btn" id="theme-toggle" hidden></button>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <div class="page-head">
      <span class="eyebrow">Member</span>
      <h1 id="hello">Welcome</h1>
      <p id="joined" class="muted"></p>
    </div>
    <div id="errors" class="msg-region" role="alert" aria-atomic="true"></div>
    <div id="notices" class="msg-region" role="status" aria-atomic="true"></div>
    <section class="card" aria-labelledby="members-title">
      <h2 id="members-title">Members</h2>
      <p id="member-count" class="muted">Loading…</p>
      <ol class="roster" id="roster" hidden></ol>
    </section>
    <section class="card" aria-labelledby="beta-title">
      <h2 id="beta-title">Beta</h2>
      <p>Everyone is a provisional member during the beta. Proposals, votes and beta assignments arrive here and in the VettID app as they open.</p>
    </section>
    <div class="actions">
      <button type="button" class="btn" id="signout">Sign out</button>
    </div>
  </main>
  <footer class="site-footer">
    <ul>
      <li><a href="https://vettid.org">vettid.org</a></li>
      <li><a href="https://vettid.org/security/">Privacy &amp; security</a></li>
      <li><a href="mailto:support@vettid.org">support@vettid.org</a></li>
    </ul>
  </footer>
</body>
</html>
